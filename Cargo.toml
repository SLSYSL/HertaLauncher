[package]
name = "herta-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
anyhow = "1"
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "accessibility",
    "backend-winit",
    "renderer-software"
] }
slint-kit = "=0.5.1"

[build-dependencies]
slint-kit-build = "=0.5.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
